name: Feature request
description: Suggest an improvement or a new feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. A clear problem statement matters
        more than a proposed solution, so start with the problem.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where the current behaviour falls short.
      placeholder: I want to know about an outage by email, not only by webhook, because my team does not run a webhook receiver.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How you imagine it working. Include an API or dashboard example if you have one.
      placeholder: |
        Add an optional SMTP configuration. When an incident opens, send a plain-text email to a configured address with the monitor name, cause, and status page link.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they fall short.
      placeholder: Pointing the incident webhook at an email gateway works, but it needs a third-party service.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - API
        - Worker / checks
        - Incidents
        - Dashboard
        - Public status pages
        - Demo target
        - Documentation
        - Deployment / Docker
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for the same request.
          required: true
        - label: I am willing to work on this (optional, not required).
          required: false
